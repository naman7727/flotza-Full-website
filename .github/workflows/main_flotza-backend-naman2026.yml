name: Build and deploy Flotza Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'Flotza-backend-nodejs/**'
      - '.github/workflows/main_flotza-backend-naman2026.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'Flotza-backend-nodejs/package-lock.json'

      - name: Install dependencies
        working-directory: Flotza-backend-nodejs
        run: npm ci

      - name: Build application
        working-directory: Flotza-backend-nodejs
        run: npm run build --if-present

      - name: Run tests
        working-directory: Flotza-backend-nodejs
        run: npm test --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: flotza-backend
          path: Flotza-backend-nodejs/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: flotza-backend
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_18D0C9C998E14CB1A85DFCAF75079207 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BDCB16A95E4740648BF2272FFB5EF186 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BFB0E99EF3DF4DF4932D07D677C4CF54 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flotza-backend-naman2026'
          slot-name: 'Production'
          package: .
